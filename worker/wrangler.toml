name = "personal-parcel-tracker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Build the dashboard and serve it; only /api/* runs the Worker.
[build]
command = "npm --prefix ../web install --no-audit --no-fund && npm --prefix ../web run build"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# KV namespaces are created automatically on first deploy.
[[kv_namespaces]]
binding = "TRACKING_CACHE"

[[kv_namespaces]]
binding = "USER_DATA"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash"
# From the Cloudflare Access application in front of this Worker.
ACCESS_TEAM_DOMAIN = "https://yourteam.cloudflareaccess.com"
ACCESS_AUD = "your-access-aud-tag"

# Secrets: GEMINI_API_KEY, SEVENTEENTRACK_API_KEY (wrangler secret put / .dev.vars)
