name = "personal-parcel-tracker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Build the dashboard and serve it; only /api/* runs the Worker.
[build]
command = "npm --prefix ../web install --no-audit --no-fund && npm --prefix ../web run build"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# KV namespaces are created automatically on first deploy.
[[kv_namespaces]]
binding = "TRACKING_CACHE"

[[kv_namespaces]]
binding = "USER_DATA"

# Headless browser for reading Flash Express's tracking page live.
[browser]
binding = "BROWSER"

# Learned hubs, routes and transit times (shared, per courier).
[[d1_databases]]
binding = "KNOWLEDGE"
database_name = "parcel-knowledge"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-3.1-flash-lite"
# IANA timezone used for "today" when estimating arrival dates.
TIMEZONE = "Asia/Manila"

# Secrets (wrangler secret put, or worker/.env locally):
# GEMINI_API_KEY, SEVENTEENTRACK_API_KEY, ACCESS_TEAM_DOMAIN, ACCESS_AUD
