name = "personal-parcel-tracker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Caches the combined tracking + Gemini result per tracking number (1h TTL).
# No `id` on purpose: `wrangler deploy` (including Workers Builds) provisions
# the namespace automatically on first deploy, and `wrangler dev` uses a local one.
[[kv_namespaces]]
binding = "TRACKING_CACHE"

[vars]
# Comma-separated origins allowed to call /api/* (Vite dev server by default).
ALLOWED_ORIGIN = "http://localhost:5173"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"

# Secrets — never commit these. Set them with:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put SEVENTEENTRACK_API_KEY
# For local dev, copy .dev.vars.example to .dev.vars and fill in the values.
